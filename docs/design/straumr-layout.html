:root[data-theme=&quot;light&quot;] {
  color-scheme: light;

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;

  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

  grid-column: 1 / -1;

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,

  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

  background: var(--foreground);

  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;

.nav-pills .nav-link.active {
  color: var(--foreground);

.nav-link:disabled,

  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);

}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;straumr-layout&quot; aria-label=&quot;Straumr terminal interface mockup&quot;&gt;
  &lt;style&gt;
    #straumr-layout {
      --str-bg: light-dark(#f5f7f9, #0d1c25);
      --str-panel: light-dark(#ffffff, #10232e);
      --str-panel-alt: light-dark(#eef3f6, #0b1922);
      --str-text: light-dark(#15202a, #d8e6ee);
      --str-muted: light-dark(#61717d, #89a1af);
      --str-border: light-dark(#b8c5cc, #36505e);
      --str-accent: light-dark(#1269ba, #52a8ff);
      --str-accent-soft: light-dark(#dceeff, #173955);
      --str-green: light-dark(#0a7652, #75d4a5);
      --str-yellow: light-dark(#8a5a00, #e8c36b);
      --str-red: light-dark(#af3030, #ff8585);
      --str-orange: light-dark(#a64b00, #f2a45d);
      --str-purple: light-dark(#7650b5, #bc9cff);
      --str-selection: light-dark(#e0effd, #17364c);
      color-scheme: light dark;
      color: var(--str-text);
      font-family: ui-monospace, SFMono-Regular, Consolas, &quot;Liberation Mono&quot;, monospace;
      width: 100%;
    }

    #straumr-layout * { box-sizing: border-box; }

    #straumr-layout .str-window {
      background: var(--str-bg);
      border: 1px solid var(--str-border);
      min-height: 650px;
      overflow: hidden;
    }

    #straumr-layout .str-topbar,
    #straumr-layout .str-footer,
    #straumr-layout .str-section-title,
    #straumr-layout .str-request-head,
    #straumr-layout .str-response-head,
    #straumr-layout .str-command {
      display: flex;
      align-items: center;
    }

    #straumr-layout .str-topbar {
      min-height: 52px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--str-border);
      gap: 18px;
    }

    #straumr-layout .str-brand {
      color: var(--str-accent);
      font-weight: 500;
      letter-spacing: .08em;
      white-space: pre;
    }

    #straumr-layout .str-context { color: var(--str-muted); }
    #straumr-layout .str-context strong { color: var(--str-text); font-weight: 500; }
    #straumr-layout .str-status { margin-left: auto; color: var(--str-green); white-space: nowrap; }

    #straumr-layout .str-workspace {
      display: grid;
      grid-template-columns: minmax(230px, 31%) minmax(0, 1fr);
      min-height: 548px;
    }

    #straumr-layout .str-sidebar {
      border-right: 1px solid var(--str-border);
      background: var(--str-panel-alt);
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    #straumr-layout .str-section-title {
      min-height: 40px;
      padding: 8px 12px;
      gap: 10px;
      border-bottom: 1px solid var(--str-border);
      color: var(--str-accent);
      font-weight: 500;
    }

    #straumr-layout .str-count {
      margin-left: auto;
      color: var(--str-muted);
      font-weight: 400;
    }

    #straumr-layout .str-filter {
      padding: 7px 12px;
      color: var(--str-muted);
      border-bottom: 1px solid var(--str-border);
    }

    #straumr-layout .str-request-list {
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 5px;
    }

    #straumr-layout .str-request-item {
      appearance: none;
      border: 0;
      border-left: 2px solid transparent;
      background: transparent;
      color: var(--str-text);
      font: inherit;
      text-align: left;
      padding: 9px 10px;
      cursor: pointer;
    }

    #straumr-layout .str-request-item[aria-selected=&quot;true&quot;] {
      background: var(--str-selection);
      border-left-color: var(--str-accent);
    }

    #straumr-layout .str-item-line { display: flex; gap: 8px; align-items: baseline; }
    #straumr-layout .str-method { font-weight: 500; }
    #straumr-layout .str-method-get,
    #straumr-layout .str-method-head { color: var(--str-green); }
    #straumr-layout .str-method-post { color: var(--str-accent); }
    #straumr-layout .str-method-put { color: var(--str-orange); }
    #straumr-layout .str-method-patch,
    #straumr-layout .str-method-options { color: var(--str-purple); }
    #straumr-layout .str-method-delete { color: var(--str-red); }
    #straumr-layout .str-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #straumr-layout .str-item-url,
    #straumr-layout .str-item-meta { color: var(--str-muted); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #straumr-layout .str-item-meta { color: var(--str-yellow); }

    #straumr-layout .str-detail {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(255px, 47%) minmax(190px, 1fr);
      background: var(--str-panel);
    }

    #straumr-layout .str-request-head {
      min-height: 64px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--str-border);
      gap: 10px;
      flex-wrap: wrap;
    }

    #straumr-layout .str-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #straumr-layout .str-id { margin-left: auto; color: var(--str-muted); }

    #straumr-layout .str-overview {
      display: grid;
      grid-template-columns: minmax(280px, 47%) minmax(0, 1fr);
      min-height: 0;
    }

    #straumr-layout .str-meta-panel,
    #straumr-layout .str-body-panel,
    #straumr-layout .str-response { min-width: 0; }

    #straumr-layout .str-meta-panel {
      border-right: 1px solid var(--str-border);
      padding: 12px 14px;
    }

    #straumr-layout .str-body-panel { padding: 12px 14px; }

    #straumr-layout .str-label {
      color: var(--str-accent);
      font-weight: 500;
      margin-bottom: 9px;
    }

    #straumr-layout .str-kv {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 7px 12px;
    }

    #straumr-layout .str-kv dt { color: var(--str-muted); }
    #straumr-layout .str-kv dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #straumr-layout .str-subsection {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--str-border);
    }

    #straumr-layout .str-subsection .str-label { margin-bottom: 6px; }
    #straumr-layout .str-secret-list { color: var(--str-green); overflow-wrap: anywhere; }
    #straumr-layout .str-sensitive { color: var(--str-yellow); }
    #straumr-layout .str-meta-panel.str-no-template .str-auth-panel { display: none; }
    #straumr-layout .str-meta-panel.str-no-template .str-subsection {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    #straumr-layout .str-body-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    #straumr-layout .str-body-head .str-label { margin: 0; }

    #straumr-layout pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--str-text);
      font: inherit;
    }

    #straumr-layout .str-code {
      background: var(--str-panel-alt);
      border-left: 2px solid var(--str-border);
      padding: 10px 12px;
      min-height: 135px;
    }

    #straumr-layout .str-dim { color: var(--str-muted); }
    #straumr-layout .str-value { color: var(--str-yellow); }

    #straumr-layout .str-response {
      border-top: 1px solid var(--str-border);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #straumr-layout .str-response-head {
      min-height: 39px;
      padding: 7px 14px;
      gap: 14px;
      border-bottom: 1px solid var(--str-border);
    }

    #straumr-layout .str-response-body { padding: 12px 14px; overflow: hidden; }
    #straumr-layout .str-ok { color: var(--str-green); font-weight: 500; }
    #straumr-layout .str-response-meta { color: var(--str-muted); }
    #straumr-layout .str-response-tabs { margin-left: auto; display: flex; gap: 14px; color: var(--str-muted); }
    #straumr-layout .str-response-tabs .str-active { color: var(--str-accent); }

    #straumr-layout .str-command {
      min-height: 38px;
      padding: 7px 12px;
      border-top: 1px solid var(--str-accent);
      background: var(--str-panel-alt);
      color: var(--str-accent);
    }

    #straumr-layout .str-command[hidden] { display: none; }
    #straumr-layout .str-command-input { color: var(--str-text); margin-left: 6px; }
    #straumr-layout .str-cursor { background: var(--str-accent); color: var(--str-panel); }

    #straumr-layout .str-footer {
      min-height: 49px;
      border-top: 1px solid var(--str-border);
      padding: 7px 12px;
      gap: 15px;
      flex-wrap: wrap;
      color: var(--str-muted);
    }

    #straumr-layout kbd {
      color: var(--str-accent);
      background: transparent;
      border: 0;
      font: inherit;
      font-weight: 500;
      padding: 0;
    }

    @media (max-width: 700px) {
      #straumr-layout .str-window { min-height: 0; }
      #straumr-layout .str-topbar { align-items: flex-start; flex-wrap: wrap; }
      #straumr-layout .str-status { margin-left: 0; }
      #straumr-layout .str-workspace { grid-template-columns: 1fr; }
      #straumr-layout .str-sidebar { border-right: 0; border-bottom: 1px solid var(--str-border); }
      #straumr-layout .str-request-list { max-height: 250px; overflow: hidden; }
      #straumr-layout .str-detail { grid-template-rows: auto auto auto; }
      #straumr-layout .str-overview { grid-template-columns: 1fr; }
      #straumr-layout .str-meta-panel { border-right: 0; border-bottom: 1px solid var(--str-border); }
      #straumr-layout .str-id { margin-left: 0; width: 100%; }
    }
  &lt;/style&gt;

          &lt;section class=&quot;str-meta-panel&quot; aria-label=&quot;Authentication and secrets&quot;&gt;
            &lt;div class=&quot;str-auth-panel&quot;&gt;
              &lt;div class=&quot;str-label&quot;&gt;Authentication&lt;/div&gt;
              &lt;dl class=&quot;str-kv&quot;&gt;
                &lt;dt&gt;Source&lt;/dt&gt;&lt;dd id=&quot;str-auth-source&quot;&gt;Template · production-oauth&lt;/dd&gt;
                &lt;dt&gt;Type&lt;/dt&gt;&lt;dd id=&quot;str-auth-type&quot;&gt;OAuth2 · Client Credentials&lt;/dd&gt;

  &lt;script&gt;
    (() =&gt; {

      const requests = {

          id: &#x27;get-user&#x27;,
          source: &#x27;Template · production-oauth&#x27;,
          type: &#x27;OAuth2 · Client Credentials&#x27;,
          injects: &#x27;Authorization&#x27;,
          material: &#x27;token hidden&#x27;,

          secrets: &#x27;oauth-client ✓ · oauth-secret ✓&#x27;,
          previewTitle: &#x27;Body preview&#x27;,
          preview: &#x27;{\n  &quot;include&quot;: [&quot;profile&quot;, &quot;permissions&quot;],\n  &quot;expand&quot;: true\n}&#x27;
        },
        custom: {

          url: &#x27;https://api.example.com/users&#x27;,
          id: &#x27;create-user&#x27;,
          source: &#x27;Template · internal-sso&#x27;,
          type: &#x27;Custom · JSON extraction&#x27;,
          injects: &#x27;X-Session-Token&#x27;,
          material: &#x27;cached value hidden&#x27;,
          status: &#x27;cached · renew on 401&#x27;,
          secrets: &#x27;auth-user ✓ · auth-password ✓&#x27;,
          previewTitle: &#x27;Body preview&#x27;,
          preview: &#x27;{\n  &quot;name&quot;: &quot;Ada Lovelace&quot;,\n  &quot;role&quot;: &quot;admin&quot;\n}&#x27;

          id: &#x27;delete-user&#x27;,

      function showRequest(key) {

        metaPanel.classList.toggle(&#x27;str-no-template&#x27;, !request.authTemplate);
        const selectedMethod = root.querySelector(&#x27;#str-selected-method&#x27;);

        root.querySelector(&#x27;#str-auth-source&#x27;).textContent = request.source;
        root.querySelector(&#x27;#str-auth-type&#x27;).textContent = request.type;
        root.querySelector(&#x27;#str-auth-injects&#x27;).textContent = request.injects;
        root.querySelector(&#x27;#str-auth-material&#x27;).textContent = request.material;
        root.querySelector(&#x27;#str-auth-status&#x27;).textContent = request.status;
        root.querySelector(&#x27;#str-secret-list&#x27;).textContent = request.secrets;
        root.querySelector(&#x27;#str-preview-title&#x27;).textContent = request.previewTitle;
        root.querySelector(&#x27;#str-preview-content&#x27;).textContent = request.preview;

      function render() {

        workspace.style.gridTemplateColumns = columns;
        detail.style.gridTemplateRows = &#x27;auto minmax(255px, 47%) minmax(190px, 1fr)&#x27;;
        command.hidden = !state.commandOpen;

      }

      root.querySelectorAll(&#x27;.str-request-item&#x27;).forEach((item) =&gt; {

          showRequest(item.dataset.request);

      showRequest(&#x27;oauth&#x27;);
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, &#x27;layout&#x27;, { label: &#x27;Panel balance&#x27;, options: [&#x27;Balanced&#x27;, &#x27;Response focus&#x27;, &#x27;List focus&#x27;], reference: &#x27;straumr.layout&#x27; });

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
