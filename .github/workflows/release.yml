name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Compute version
        id: meta
        shell: bash
        run: |
          DATE_UTC="$(date -u '+%Y.%-m.%-d')"
          VERSION="${DATE_UTC}.${GITHUB_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_PROJECT: src/Straumr.Console.App/Straumr.Console.App.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dotnet publish "${APP_PROJECT}" \
            -c Release -r ${{ matrix.rid }} \
            -o artifacts/${{ matrix.rid }} \
            -p:IncludeTui=true \
            "/p:Version=${VERSION}" \
            "/p:FileVersion=${VERSION}" \
            "/p:InformationalVersion=${VERSION}"

          if [ ! -f "artifacts/${{ matrix.rid }}/straumr" ]; then
            echo "Publish did not produce artifacts/${{ matrix.rid }}/straumr" >&2
            exit 1
          fi

          mkdir -p dist
          tar -C artifacts/${{ matrix.rid }} -czf "dist/straumr-${VERSION}-${{ matrix.rid }}.tar.gz" straumr

      - name: Build .deb package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          NFPM_VERSION: 2.47.0
        run: |
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb
          cp artifacts/${{ matrix.rid }}/straumr .
          VERSION=${VERSION} nfpm pkg -f packaging/deb/nfpm.yaml -p deb -t dist/

          if [ ! -f "dist/straumr_${VERSION}_amd64.deb" ]; then
            echo "nfpm did not produce dist/straumr_${VERSION}_amd64.deb" >&2
            ls -la dist >&2
            exit 1
          fi

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish $env:APP_PROJECT `
            -c Release -r ${{ matrix.rid }} `
            -o artifacts/${{ matrix.rid }} `
            -p:IncludeTui=true `
            /p:Version=${env:VERSION} `
            /p:FileVersion=${env:VERSION} `
            /p:InformationalVersion=${env:VERSION}

          if (-not (Test-Path "artifacts/${{ matrix.rid }}/straumr.exe")) {
            throw "Publish did not produce artifacts/${{ matrix.rid }}/straumr.exe"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path artifacts/${{ matrix.rid }}/straumr.exe -DestinationPath dist/straumr-${env:VERSION}-${{ matrix.rid }}.zip

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc /DMyAppVersion="${env:VERSION}" `
               /DMySourceDir="${env:GITHUB_WORKSPACE}\artifacts\${{ matrix.rid }}" `
               /DMyOutputDir="${env:GITHUB_WORKSPACE}\dist" `
               /DMyLicenseFile="${env:GITHUB_WORKSPACE}\LICENSE" `
               /DMyIconFile="${env:GITHUB_WORKSPACE}\src\Straumr.Console.App\icon.ico" `
               installer\straumr.iss

          $setup = "dist/straumr-$env:VERSION-win-x64-setup.exe"
          if (-not (Test-Path $setup)) {
            Get-ChildItem dist | Format-Table -AutoSize | Out-String | Write-Host
            throw "Inno Setup did not produce $setup"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify expected assets
        shell: bash
        run: |
          missing=0
          for file in \
            "straumr-${VERSION}-linux-x64.tar.gz" \
            "straumr_${VERSION}_amd64.deb" \
            "straumr-${VERSION}-win-x64.zip" \
            "straumr-${VERSION}-win-x64-setup.exe"
          do
            if [ ! -f "dist/${file}" ]; then
              echo "Missing expected asset: ${file}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "--- dist contains ---" >&2
            ls -la dist >&2
            exit 1
          fi

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Create signatures and checksums
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$MINISIGN_PRIVATE_KEY" ]; then
            echo "Missing MINISIGN_PRIVATE_KEY secret" >&2
            exit 1
          fi

          echo "$MINISIGN_PRIVATE_KEY" > minisign.key
          chmod 600 minisign.key

          (cd dist && find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -printf '%P\n' | sort | xargs sha256sum > sha256sums.txt)

          shopt -s nullglob
          for file in dist/*; do
            case "$file" in
              *.minisig) continue ;;
            esac
            [ -f "$file" ] || continue
            echo "" | minisign -S -s minisign.key -m "$file" -x "${file}.minisig"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*

  aur:
    needs: [ version, release ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Set up SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "Missing AUR_SSH_KEY secret" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "Host aur.archlinux.org" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/aur" >> ~/.ssh/config
          echo "  User aur" >> ~/.ssh/config
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download linux tarball and compute sha256
        id: checksum
        run: |
          curl -fsSL --retry 10 --retry-delay 6 --retry-all-errors \
            -o tarball.tar.gz \
            "https://github.com/albinalm/Straumr/releases/download/v${VERSION}/straumr-${VERSION}-linux-x64.tar.gz"
          SHA256=$(sha256sum tarball.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Clone AUR repo and update
        env:
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          git clone ssh://aur@aur.archlinux.org/straumr-bin.git
          cd straumr-bin

          cp ../packaging/aur/PKGBUILD .
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD

          cat > .SRCINFO << SRCEOF
          pkgbase = straumr-bin
          	pkgdesc = CLI tool for managing, saving, and sending HTTP requests across workspaces
          	pkgver = ${VERSION}
          	pkgrel = 1
          	url = https://github.com/albinalm/Straumr
          	arch = x86_64
          	license = GPL-3.0-only
          	provides = straumr
          	conflicts = straumr
          	options = !debug
          	source = straumr-bin-${VERSION}.tar.gz::https://github.com/albinalm/Straumr/releases/download/v${VERSION}/straumr-${VERSION}-linux-x64.tar.gz
          	sha256sums = ${SHA256}

          pkgname = straumr-bin
          SRCEOF

          git config user.email "albinalm@proton.me"
          git config user.name "Albin Alm"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}"
          git push

  winget:
    needs: [ version, release ]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SETUP_URL: https://github.com/albinalm/straumr/releases/download/v${{ needs.version.outputs.version }}/straumr-${{ needs.version.outputs.version }}-win-x64-setup.exe
    steps:
      - name: Wait for release asset
        shell: pwsh
        run: |
          for ($i = 1; $i -le 10; $i++) {
            try {
              Invoke-WebRequest -Uri $env:SETUP_URL -Method Head -UseBasicParsing | Out-Null
              Write-Host "Asset reachable after $i attempt(s)."
              exit 0
            }
            catch {
              Write-Host "Attempt ${i}: asset not reachable yet."
              Start-Sleep -Seconds 15
            }
          }

          throw "Release asset never became reachable: $env:SETUP_URL"

      - name: Install wingetcreate
        shell: pwsh
        run: iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Generate winget manifest
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            throw "Missing WINGET_PAT secret"
          }

          .\wingetcreate.exe update AlbinAlm.Straumr `
            --version $env:VERSION `
            --urls $env:SETUP_URL `
            --token $env:WINGET_PAT

      - name: Submit winget PR manually
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          $owner = gh api user --jq .login
          $manifestRoot = "manifests\a\AlbinAlm\Straumr\$env:VERSION"
          $branch = "straumr-$env:VERSION"

          if (-not (Test-Path $manifestRoot)) {
            throw "Expected generated manifest directory '$manifestRoot' was not found."
          }

          gh repo view "$owner/winget-pkgs" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh repo fork microsoft/winget-pkgs --clone=false --remote=false
          }

          gh repo sync "$owner/winget-pkgs" --source microsoft/winget-pkgs --branch master --force
          gh repo clone "$owner/winget-pkgs" winget-pkgs -- --depth=1

          Set-Location winget-pkgs
          git remote set-url origin "https://x-access-token:$env:GH_TOKEN@github.com/$owner/winget-pkgs.git"
          git checkout -b $branch
          $targetDir = "manifests/a/AlbinAlm/Straumr/$env:VERSION"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          Copy-Item -Path "..\$manifestRoot\*" -Destination $targetDir -Recurse -Force

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add $targetDir
          git commit -m "Add AlbinAlm.Straumr version $env:VERSION"
          git push --set-upstream origin $branch

          gh pr create `
            --repo microsoft/winget-pkgs `
            --base master `
            --head "${owner}:$branch" `
            --title "Add AlbinAlm.Straumr version $env:VERSION" `
            --body "Automated submission for Straumr version $env:VERSION."

  copr:
    needs: [ version, release ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install copr-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install copr-cli

      - name: Configure copr-cli
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_API_TOKEN" ] || [ -z "$COPR_USERNAME" ]; then
            echo "Missing one of COPR_LOGIN, COPR_API_TOKEN, COPR_USERNAME" >&2
            exit 1
          fi

          mkdir -p ~/.config
          echo "[copr-cli]" > ~/.config/copr
          echo "copr_url = https://copr.fedorainfracloud.org" >> ~/.config/copr
          echo "gssapi = false" >> ~/.config/copr
          echo "login = ${COPR_LOGIN}" >> ~/.config/copr
          echo "token = ${COPR_API_TOKEN}" >> ~/.config/copr
          echo "username = ${COPR_USERNAME}" >> ~/.config/copr

      - name: Build SRPM and submit to COPR
        run: |
          sudo apt-get install -y rpm
          mkdir -p ~/rpmbuild/{SOURCES,SPECS,SRPMS}

          curl -fsSL --retry 10 --retry-delay 6 --retry-all-errors \
            -o "$HOME/rpmbuild/SOURCES/straumr-${VERSION}-linux-x64.tar.gz" \
            "https://github.com/albinalm/Straumr/releases/download/v${VERSION}/straumr-${VERSION}-linux-x64.tar.gz"

          cp packaging/copr/straumr.spec ~/rpmbuild/SPECS/
          sed -i "s/%{VERSION_PLACEHOLDER}/${VERSION}/g" ~/rpmbuild/SPECS/straumr.spec

          git fetch --tags --force --quiet
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -v "^v${VERSION}\$" | head -1)
          DATE=$(date -u '+%a %b %d %Y')
          CHANGELOG="* ${DATE} Albin Alm <albinalm@proton.me> - ${VERSION}-1"
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            COMMITS="- Initial package"
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="- Packaging update"
          fi
          sed -i "/%changelog/,\$d" ~/rpmbuild/SPECS/straumr.spec
          printf "\n%%changelog\n%s\n%s\n" "$CHANGELOG" "$COMMITS" >> ~/rpmbuild/SPECS/straumr.spec

          rpmbuild -bs ~/rpmbuild/SPECS/straumr.spec

          SRPM=$(find ~/rpmbuild/SRPMS -name '*.src.rpm' | head -1)
          if [ -z "$SRPM" ]; then
            echo "rpmbuild did not produce an SRPM" >&2
            exit 1
          fi

          copr-cli build straumr "$SRPM"

  apt:
    needs: [ version, release ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APT_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gpg

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "Missing APT_GPG_PRIVATE_KEY secret" >&2
            exit 1
          fi

          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Checkout apt repo branch
        run: |
          if git clone --branch apt-repo --depth 1 "$APT_REMOTE" apt-repo; then
            echo "Cloned existing apt-repo branch."
          else
            echo "No apt-repo branch yet; initialising a new one."
            mkdir -p apt-repo
            git -C apt-repo init -b apt-repo
            git -C apt-repo remote add origin "$APT_REMOTE"
          fi

      - name: Download .deb from build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-x64
          path: apt-repo/pool/main

      - name: Keep only .deb packages in pool
        run: |
          find apt-repo/pool/main -type f ! -name '*.deb' -delete

          if [ ! -f "apt-repo/pool/main/straumr_${VERSION}_amd64.deb" ]; then
            echo "Expected apt-repo/pool/main/straumr_${VERSION}_amd64.deb" >&2
            ls -la apt-repo/pool/main >&2
            exit 1
          fi

      - name: Generate APT repo metadata
        run: |
          cd apt-repo
          mkdir -p dists/stable/main/binary-amd64

          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages

          cd dists/stable
          cat > Release << EOF
          Origin: Straumr
          Label: Straumr
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Straumr APT repository
          EOF
          sed -i 's/^          //' Release

          apt-ftparchive release . >> Release

          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          if [ -z "$GPG_KEY_ID" ]; then
            echo "No secret GPG key available for signing" >&2
            exit 1
          fi

          gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release

      - name: Export public key
        run: |
          cd apt-repo
          gpg --armor --export > straumr.gpg.key

      - name: Push to apt-repo branch
        run: |
          cd apt-repo
          git config user.email "albinalm@proton.me"
          git config user.name "Albin Alm"
          git add -A
          git commit -m "Update APT repo to ${VERSION}" || true
          git push -u origin apt-repo
